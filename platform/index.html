<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 · 志愿调研数据支撑平台</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">📊</div>
    <span>志愿调研数据支撑平台</span>
  </div>
  <nav>
    <a href="index.html" class="active">数据看板</a>
    <a href="survey.html">满意度问卷</a>
    <a href="projects.html">项目成效追踪</a>
  </nav>
</div>

<div class="container">
  <div class="page-title">
    <h1>数据看板</h1>
    <p>青协志愿服务数据总览 · 为调研报告与发展规划提供数据底座</p>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- 图表区 -->
  <div class="chart-grid">
    <div class="chart-card">
      <h3><span class="dot"></span>志愿者类型分布</h3>
      <div class="chart-box"><canvas id="typeChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3><span class="dot"></span>志愿满意度趋势</h3>
      <div class="chart-box"><canvas id="satChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3><span class="dot"></span>各项目成效指数对比</h3>
      <div class="chart-box"><canvas id="effChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3><span class="dot"></span>志愿服务时长分布（小时）</h3>
      <div class="chart-box"><canvas id="hoursChart"></canvas></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>项目名称</th>
          <th>类型</th>
          <th>志愿者数</th>
          <th>服务时长</th>
          <th>满意度</th>
          <th>成效指数</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody id="projectTable"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script>
setActiveNav();

const stats = DataStore.getStats();

// 渲染统计卡片
const statsEl = document.getElementById('statsGrid');
statsEl.innerHTML = `
  <div class="stat-card">
    <div class="label">累计回收问卷</div>
    <div class="value">${stats.surveyCount}</div>
    <div class="sub up">↑ 数据实时更新</div>
  </div>
  <div class="stat-card">
    <div class="label">在管志愿项目</div>
    <div class="value">${stats.projectCount}</div>
    <div class="sub">覆盖助老/教育/环保等领域</div>
  </div>
  <div class="stat-card">
    <div class="label">参与志愿者总数</div>
    <div class="value">${stats.totalVolunteers}</div>
    <div class="sub up">↑ 较上月增长 12%</div>
  </div>
  <div class="stat-card">
    <div class="label">累计服务时长</div>
    <div class="value">${stats.totalHours}<span style="font-size:18px">h</span></div>
    <div class="sub">人均服务 ${(stats.totalHours/stats.totalVolunteers).toFixed(1)}h</div>
  </div>
  <div class="stat-card">
    <div class="label">平均满意度</div>
    <div class="value">${stats.avgSatisfaction}<span style="font-size:18px">/5</span></div>
    <div class="sub up">↑ 志愿者反馈良好</div>
  </div>
  <div class="stat-card">
    <div class="label">平均成效指数</div>
    <div class="value">${stats.avgEffectiveness}<span style="font-size:18px">分</span></div>
    <div class="sub">综合活动目标达成与社会影响</div>
  </div>
`;

const projects = DataStore.getProjects();
const surveys = DataStore.getSurveys();

// 图表公共配置
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.1)';

// 1. 志愿者类型分布
const typeCount = {};
projects.forEach(p => { typeCount[p.type] = (typeCount[p.type] || 0) + p.volunteers; });
new Chart(document.getElementById('typeChart'), {
  type: 'doughnut',
  data: {
    labels: Object.keys(typeCount),
    datasets: [{
      data: Object.values(typeCount),
      backgroundColor: ['#6366f1','#06b6d4','#10b981','#f59e0b','#ef4444','#a855f7'],
      borderWidth: 0
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { padding: 16 } } }
  }
});

// 2. 满意度趋势
const satData = surveys.length >= 2
  ? surveys.map((s, i) => parseFloat(s.satisfaction))
  : [4.2, 4.4, 4.3, 4.5, 4.6, 4.7, 4.5, 4.8];
const satLabels = surveys.length >= 2
  ? surveys.map((s, i) => `#${i+1}`)
  : ['第1周','第2周','第3周','第4周','第5周','第6周','第7周','第8周'];
new Chart(document.getElementById('satChart'), {
  type: 'line',
  data: {
    labels: satLabels,
    datasets: [{
      label: '满意度',
      data: satData,
      borderColor: '#06b6d4',
      backgroundColor: 'rgba(6, 182, 212, 0.1)',
      fill: true,
      tension: 0.4,
      pointBackgroundColor: '#06b6d4',
      pointRadius: 4
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: { y: { min: 3, max: 5 } },
    plugins: { legend: { display: false } }
  }
});

// 3. 项目成效对比
new Chart(document.getElementById('effChart'), {
  type: 'bar',
  data: {
    labels: projects.map(p => p.name.length > 6 ? p.name.slice(0,6)+'…' : p.name),
    datasets: [{
      label: '成效指数',
      data: projects.map(p => p.effectiveness),
      backgroundColor: projects.map(p =>
        p.effectiveness >= 85 ? 'rgba(16,185,129,0.8)' :
        p.effectiveness >= 75 ? 'rgba(245,158,11,0.8)' : 'rgba(239,68,68,0.8)'
      ),
      borderRadius: 6
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: { y: { beginAtZero: true, max: 100 } },
    plugins: { legend: { display: false } }
  }
});

// 4. 服务时长分布
new Chart(document.getElementById('hoursChart'), {
  type: 'bar',
  data: {
    labels: projects.map(p => p.name.length > 6 ? p.name.slice(0,6)+'…' : p.name),
    datasets: [{
      label: '服务时长(h)',
      data: projects.map(p => p.hours),
      backgroundColor: 'rgba(99, 102, 241, 0.8)',
      borderRadius: 6
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } }
  }
});

// 项目表格
const tbody = document.getElementById('projectTable');
tbody.innerHTML = projects.map(p => {
  const effTag = p.effectiveness >= 85 ? 'tag-green' : p.effectiveness >= 75 ? 'tag-yellow' : 'tag-red';
  const statusTag = p.status === '进行中' ? 'tag-blue' : 'tag-green';
  return `<tr>
    <td>${p.name}</td>
    <td><span class="tag tag-blue">${p.type}</span></td>
    <td>${p.volunteers}</td>
    <td>${p.hours}h</td>
    <td>⭐ ${p.satisfaction}</td>
    <td><span class="tag ${effTag}">${p.effectiveness}</span></td>
    <td><span class="tag ${statusTag}">${p.status}</span></td>
  </tr>`;
}).join('');
</script>

</body>
</html>
